<!DOCTYPE html>
<html><body>
<script type="module">
    window.__totalTests = 0;
    window.__passedTests = 0;
    window.__failures = [];

    class Assert {
        static assertTrue(val, msg = 'expected true') {
            window.__totalTests++;
            if (!val) throw new Error(msg);
            window.__passedTests++;
        }
        static assertFalse(val, msg = 'expected false') {
            window.__totalTests++;
            if (val) throw new Error(msg);
            window.__passedTests++;
        }
        static assertEquals(expected, actual, msg = '') {
            window.__totalTests++;
            if (expected !== actual) throw new Error(msg || `expected ${expected}, got ${actual}`);
            window.__passedTests++;
        }
        static assertNull(val, msg = 'expected null') {
            window.__totalTests++;
            if (val !== null && val !== undefined) throw new Error(msg);
            window.__passedTests++;
        }
        static assertNotNull(val, msg = 'expected non-null') {
            window.__totalTests++;
            if (val === null || val === undefined) throw new Error(msg);
            window.__passedTests++;
        }
        static assertThrows(fn, msg = 'expected an error') {
            window.__totalTests++;
            try { fn(); } catch (e) { window.__passedTests++; return; }
            throw new Error(msg);
        }
    }
    globalThis.TestCase = Assert;

    const testFiles = [
        'CookieTest.js',
        'DialogTest.js',
        'EmojiRendererTest.js',
        'DOMUtilsTest.js',
        'RelativeTimeTest.js',
    ];

    for (const file of testFiles) {
        try {
            const module = await import('./' + file);
            const { suite, tests } = module.default;
            console.group(suite);
            for (const [name, fn] of Object.entries(tests)) {
                try {
                    await fn();
                    console.log(`  %cPASS%c  ${suite} :: ${name}`, 'color: green', '');
                } catch (err) {
                    window.__failures.push({ suite, name, message: err.message });
                    console.log(`  %cFAIL%c  ${suite} :: ${name}  —  ${err.message}`, 'color: red', '');
                }
            }
            console.groupEnd();
        } catch (err) {
            console.error(`Could not load "${file}":`, err);
        }
    }

    window.__testsComplete();
</script>
</body></html>
